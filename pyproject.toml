[project]
name = "corrective-agentic-rag-for-knowledge-retrieval"
version = "0.1.0"
description = "Corrective Agentic RAG for Knowledge Retrieval: answers questions about Databricks documentation (Unity Catalog and Databricks SQL) using text, semantic, and graph retrieval with a Tavily web search fallback."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    # Orchestration
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.2.0",
    "langchain-community<0.4.2",
    "langchain-neo4j>=0.1.0",
    # LLM
    "anthropic>=0.34.0",
    # Tracing and LLM ops
    "langsmith>=0.1.0",
    # Text retrieval
    "rank-bm25>=0.2.2",
    # Semantic retrieval and reranking
    "sentence-transformers>=3.0.0",
    "chromadb>=0.5.0",
    # Graph retrieval
    "neo4j>=5.20.0",
    # Web search fallback
    "tavily-python>=0.5.0",
    # Evaluation
    "ragas>=0.2.0",
    # UI
    "gradio>=4.40.0",
    # PDF ingestion
    "pymupdf>=1.24.0",
    # Structured output and config
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "pytesseract>=0.3.13",
    "pillow>=12.3.0",
    "langchain-text-splitters>=1.1.2",
    "langchain-huggingface>=1.2.2",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.0",
    "jupyter>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crag"]
